<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Follow-ups | AcxiomCRM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-dark px-4"><a class="navbar-brand" href="/">AcxiomCRM</a></nav><main class="container py-4"><div class="d-flex justify-content-between mb-3"><h1 class="h3">Follow-up Management</h1><a href="/followups/new" class="btn btn-primary">+ Schedule follow-up</a></div><div class="row g-3 mb-3"><div class="col-md-6"><div class="card"><div class="card-body">Pending: <strong th:text="${pending}">0</strong></div></div></div><div class="col-md-6"><div class="card"><div class="card-body">Overdue: <strong th:text="${overdue}">0</strong></div></div></div></div><div class="table-responsive"><table class="table table-striped bg-white"><thead><tr><th>Subject</th><th>Date</th><th>Related</th><th>Record ID</th><th>Type</th><th>Status</th><th>Assigned</th><th>Actions</th></tr></thead><tbody><tr th:each="f : ${followups}"><td th:text="${f.subject}"></td><td th:text="${f.followUpDate}"></td><td th:text="${f.relatedType}"></td><td th:text="${f.relatedId}"></td><td th:text="${f.type}"></td><td><span th:text="${f.status}"></span><span th:if="${f.overdue}" class="badge text-bg-danger ms-1">Overdue</span></td><td th:text="${f.assignedUser}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/followups/{id}/edit(id=${f.id})}">Edit</a> <form class="d-inline" method="post" th:action="@{/followups/{id}/delete(id=${f.id})}" onsubmit="return confirm('Delete follow-up?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(followups)}"><td colspan="8" class="text-center">No follow-ups yet.</td></tr></tbody></table></div><a href="/" class="btn btn-link">Dashboard</a></main></body></html>
