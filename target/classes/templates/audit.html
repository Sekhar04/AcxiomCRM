<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Audit Log</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-4"><h1 class="h3">Audit Log</h1><form class="d-flex gap-2 my-3"><input class="form-control" name="module" th:value="${module}" placeholder="Filter module"><button class="btn btn-primary">Filter</button></form><div class="table-responsive"><table class="table table-striped bg-white"><thead><tr><th>Time</th><th>User</th><th>Module</th><th>Action</th><th>Record ID</th><th>Result</th><th>Details</th></tr></thead><tbody><tr th:each="a : ${logs}"><td th:text="${a.timestamp}"></td><td th:text="${a.username}"></td><td th:text="${a.module}"></td><td th:text="${a.action}"></td><td th:text="${a.recordId}"></td><td th:text="${a.result}"></td><td th:text="${a.details}"></td></tr></tbody></table></div><a href="/" class="btn btn-link">Dashboard</a></main></body></html>
