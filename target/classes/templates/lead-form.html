<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead form</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-4" style="max-width:760px"><div class="card"><div class="card-body"><h1 th:text="${lead.id==null?'Add Lead':'Edit Lead'}"></h1><form th:object="${lead}" th:action="${lead.id==null?'/leads':'/leads/'+lead.id}" method="post"><label class="form-label">Name *</label><input class="form-control mb-2" th:field="*{name}" required maxlength="100"><div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div><label class="form-label">Email</label><input class="form-control mb-2" type="email" th:field="*{email}"><div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div><label class="form-label">Phone</label><input class="form-control mb-2" th:field="*{phone}"><label class="form-label">Company</label><input class="form-control mb-2" th:field="*{company}"><label class="form-label">Source *</label><select class="form-select mb-2" th:field="*{source}" required><option value="">Select</option><option>Website</option><option>Referral</option><option>Social Media</option><option>Cold Call</option><option>Other</option></select><label class="form-label">Status</label><select class="form-select mb-2" th:field="*{status}"><option th:each="s:${statuses}" th:value="${s}" th:text="${s}"></option></select><label class="form-label">Expected value</label><input class="form-control mb-2" type="number" min="0" step=".01" th:field="*{expectedValue}" required><div class="text-danger" th:if="${#fields.hasErrors('expectedValue')}" th:errors="*{expectedValue}"></div><label class="form-label">Assigned to</label><input class="form-control mb-3" th:field="*{assignedTo}"><button class="btn btn-primary">Save lead</button> <a href="/leads" class="btn btn-secondary">Cancel</a></form></div></div></main></body></html>
