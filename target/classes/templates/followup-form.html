<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Follow-up | AcxiomCRM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-4" style="max-width:760px"><div class="card"><div class="card-body p-4"><h1 class="h3" th:text="${followup.id == null ? 'Schedule Follow-up' : 'Edit Follow-up'}">Schedule Follow-up</h1><form th:object="${followup}" th:action="${followup.id == null ? '/followups' : '/followups/' + followup.id}" method="post"><div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}"><p th:each="e : ${#fields.globalErrors()}" th:text="${e.defaultMessage}"></p></div><div class="mb-3"><label class="form-label">Subject *</label><input class="form-control" th:field="*{subject}" required maxlength="150"><div class="text-danger" th:errors="*{subject}"></div></div><div class="mb-3"><label class="form-label">Date *</label><input class="form-control" type="date" th:field="*{followUpDate}" th:attr="min=${today}" required><div class="text-danger" th:errors="*{followUpDate}"></div></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Related module</label><select class="form-select" th:field="*{relatedType}"><option th:each="x : ${relatedTypes}" th:value="${x}" th:text="${x}"></option></select></div><div class="col-md-6 mb-3"><label class="form-label">Related record ID *</label><input class="form-control" type="number" th:field="*{relatedId}" min="1" required></div><div class="col-md-6 mb-3"><label class="form-label">Type</label><select class="form-select" th:field="*{type}"><option th:each="x : ${types}" th:value="${x}" th:text="${x}"></option></select></div><div class="col-md-6 mb-3"><label class="form-label">Status</label><select class="form-select" th:field="*{status}"><option th:each="x : ${statuses}" th:value="${x}" th:text="${x}"></option></select></div></div><div class="mb-3"><label class="form-label">Assigned user</label><input class="form-control" th:field="*{assignedUser}" maxlength="100"></div><div class="mb-3"><label class="form-label">Notes</label><textarea class="form-control" th:field="*{notes}" rows="3"></textarea></div><button class="btn btn-primary">Save Follow-up</button> <a href="/followups" class="btn btn-outline-secondary">Cancel</a></form></div></div></main></body></html>
