<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leads</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-4"><div class="d-flex justify-content-between"><h1>Lead Management</h1><a class="btn btn-primary" href="/leads/new">Add lead</a></div><form class="row g-2 my-3" method="get"><div class="col-md-6"><input class="form-control" name="q" th:value="${q}" placeholder="Search name/company"></div><div class="col-md-3"><select class="form-select" name="status"><option value="">All statuses</option><option th:each="s:${statuses}" th:value="${s}" th:text="${s}" th:selected="${s==selectedStatus}"></option></select></div><div class="col-auto"><button class="btn btn-outline-primary">Filter</button></div></form><table class="table table-striped bg-white"><thead><tr><th>Name</th><th>Company</th><th>Status</th><th>Source</th><th>Expected value</th><th>Assigned to</th><th></th></tr></thead><tbody><tr th:each="l:${leads}"><td th:text="${l.name}"></td><td th:text="${l.company}"></td><td th:text="${l.status}"></td><td th:text="${l.source}"></td><td th:text="${l.expectedValue}"></td><td th:text="${l.assignedTo}"></td><td><a class="btn btn-sm btn-outline-secondary" th:href="@{/leads/{id}/edit(id=${l.id})}">Edit</a><form style="display:inline" method="post" th:action="@{/leads/{id}/delete(id=${l.id})}"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr></tbody></table><a href="/">Dashboard</a></main></body></html>
