<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Opportunity | AcxiomCRM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-dark px-4"><a class="navbar-brand" href="/">AcxiomCRM</a><form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm">Logout</button></form></nav><main class="container py-4" style="max-width:800px"><div class="card"><div class="card-body p-4"><h1 class="h3" th:text="${opportunity.id == null ? 'Add Opportunity' : 'Edit Opportunity'}">Add Opportunity</h1><form th:object="${opportunity}" th:action="${opportunity.id == null ? '/opportunities' : '/opportunities/' + opportunity.id}" method="post"><div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}"><ul class="mb-0"><li th:each="e : ${#fields.globalErrors()}" th:text="${e.defaultMessage}"></li></ul></div><div class="mb-3"><label class="form-label">Opportunity Name *</label><input class="form-control" th:field="*{name}" maxlength="120" required><div class="text-danger" th:errors="*{name}"></div></div><div class="mb-3"><label class="form-label">Customer *</label><select class="form-select" name="customerId" required><option value="">Select customer</option><option th:each="c : ${customers}" th:value="${c.id}" th:text="${c.name}" th:selected="${selectedCustomerId != null and selectedCustomerId == c.id}"></option></select><div class="text-danger" th:if="${#fields.hasErrors('customer')}" th:errors="*{customer}"></div></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label">Amount (₹) *</label><input class="form-control" type="number" th:field="*{amount}" min="0.01" step="0.01" required><div class="text-danger" th:errors="*{amount}"></div></div><div class="col-md-6 mb-3"><label class="form-label">Probability (%) *</label><input class="form-control" type="number" th:field="*{probability}" min="0" max="100" required><div class="text-danger" th:errors="*{probability}"></div></div></div><div class="mb-3"><label class="form-label">Expected Close Date *</label><input class="form-control" type="date" th:field="*{expectedCloseDate}" th:attr="min=${today}" required><div class="text-danger" th:errors="*{expectedCloseDate}"></div></div><div class="mb-3"><label class="form-label">Stage *</label><select class="form-select" th:field="*{stage}" required><option th:each="s : ${stages}" th:value="${s}" th:text="${s}"></option></select><div class="text-danger" th:errors="*{stage}"></div></div><div class="mb-3"><label class="form-label">Source</label><input class="form-control" th:field="*{source}"></div><div class="mb-3"><label class="form-label">Notes</label><textarea class="form-control" th:field="*{notes}" rows="3"></textarea></div><button class="btn btn-primary">Save Opportunity</button> <a href="/opportunities" class="btn btn-outline-secondary">Cancel</a></form></div></div></main></body></html>
