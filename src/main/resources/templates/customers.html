<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customers - AcxiomCRM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-dark px-4"><a class="navbar-brand" href="/">AcxiomCRM</a><form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm">Logout</button></form></nav><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h3">Customers</h1><a class="btn btn-primary" href="/customers/new">+ Add customer</a></div><form class="row g-2 mb-3" method="get"><div class="col-sm-8"><input class="form-control" name="q" th:value="${q}" placeholder="Search name, email or company"></div><div class="col-auto"><button class="btn btn-outline-primary">Search</button></div></form><div class="table-responsive"><table class="table table-striped table-hover bg-white"><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Company</th><th>Status</th><th>Actions</th></tr></thead><tbody><tr th:each="c : ${customers}"><td th:text="${c.name}"></td><td th:text="${c.email}"></td><td th:text="${c.phone}"></td><td th:text="${c.company}"></td><td th:text="${c.status}"></td><td class="d-flex gap-2"><a class="btn btn-sm btn-outline-secondary" th:href="@{/customers/{id}/edit(id=${c.id})}">Edit</a><form th:action="@{/customers/{id}/delete(id=${c.id})}" method="post" onsubmit="return confirm('Delete this customer?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(customers)}"><td colspan="6" class="text-center text-secondary">No customers found.</td></tr></tbody></table></div><a href="/" class="btn btn-link">← Dashboard</a></main></body></html>
