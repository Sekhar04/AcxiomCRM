<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Opportunities | AcxiomCRM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-dark px-4"><a class="navbar-brand" href="/">AcxiomCRM</a><form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm">Logout</button></form></nav><main class="container py-4"><div class="d-flex justify-content-between mb-3"><h1 class="h3">Opportunities</h1><a href="/opportunities/new" class="btn btn-primary">+ Add Opportunity</a></div><div class="row g-3 mb-4"><div class="col-md-6"><div class="card"><div class="card-body">Open pipeline<h3 th:text="${#numbers.formatDecimal(pipeline,1,2)}">0.00</h3></div></div></div><div class="col-md-6"><div class="card"><div class="card-body">Weighted pipeline<h3 th:text="${#numbers.formatDecimal(weightedPipeline,1,2)}">0.00</h3></div></div></div></div><div class="table-responsive"><table class="table table-striped bg-white"><thead><tr><th>Name</th><th>Customer</th><th>Amount</th><th>Probability</th><th>Weighted</th><th>Close date</th><th>Stage</th><th>Actions</th></tr></thead><tbody><tr th:each="o : ${opportunities}"><td th:text="${o.name}"></td><td th:text="${o.customer.name}"></td><td th:text="${o.amount}"></td><td th:text="${o.probability + '%'}"></td><td th:text="${o.weightedValue}"></td><td th:text="${o.expectedCloseDate}"></td><td th:text="${o.stage}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/opportunities/{id}/edit(id=${o.id})}">Edit</a> <form class="d-inline" method="post" th:action="@{/opportunities/{id}/delete(id=${o.id})}" onsubmit="return confirm('Delete opportunity?')"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr><tr th:if="${#lists.isEmpty(opportunities)}"><td colspan="8" class="text-center">No opportunities yet.</td></tr></tbody></table></div><a href="/" class="btn btn-link">Dashboard</a></main></body></html>
