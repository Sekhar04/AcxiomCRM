<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customer Form - AcxiomCRM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-dark px-4"><a class="navbar-brand" href="/">AcxiomCRM</a></nav><main class="container py-4" style="max-width:760px"><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-4" th:text="${customer.id == null ? 'Add Customer' : 'Edit Customer'}">Add Customer</h1><form th:object="${customer}" th:action="${customer.id == null ? '/customers' : '/customers/' + customer.id}" method="post"><div class="mb-3"><label class="form-label">Customer name *</label><input class="form-control" th:field="*{name}" required maxlength="100"><div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div></div><div class="mb-3"><label class="form-label">Email *</label><input class="form-control" type="email" th:field="*{email}" required><div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div></div><div class="mb-3"><label class="form-label">Phone *</label><input class="form-control" th:field="*{phone}" required minlength="10" maxlength="15"><div class="text-danger small" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div></div><div class="mb-3"><label class="form-label">Company</label><input class="form-control" th:field="*{company}"></div><div class="mb-3"><label class="form-label">Status</label><select class="form-select" th:field="*{status}"><option>ACTIVE</option><option>INACTIVE</option></select></div><div class="d-flex gap-2"><button class="btn btn-primary">Save customer</button><a href="/customers" class="btn btn-outline-secondary">Cancel</a></div></form></div></div></main></body></html>
